<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .top-nav {
            position: absolute;
            top: 10px;
            right: 20px;
        }
        .top-nav a {
            margin: 0 10px;
            text-decoration: none;
            color: black;
            font-size: 14px;
        }
        .google-logo {
            font-size: 5rem;
            font-weight: bold;
            text-align: center;
            letter-spacing: 0px;
        }
        .search-container {
            width: 100%;
            max-width: 600px;
        }
        .search-box {
            width: 100%;
            padding: 10px;
            border-radius: 25px;
            border: 1px solid #dfe1e5;
            outline: none;
        }
        .buttons {
            margin-top: 20px;
        }
        .footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            text-align: center;
            padding: 10px;
            background: #f8f9fa;
        }
    </style>
</head>
<body>
    <div class="top-nav">
        <a href="#">About</a>
        <a href="#">Store</a>
        <a href="#">Gmail</a>
        <a href="#">Images</a>
    </div>
    <div class="google-logo">
        <span style="color: #4285F4;">G</span>
        <span style="color: #EA4335;">o</span>
        <span style="color: #FBBC05;">o</span>
        <span style="color: #4285F4;">g</span>
        <span style="color: #34A853;">l</span>
        <span style="color: #EA4335;">e</span>
    </div>
    <div class="search-container text-center mt-3">
        <input type="text" class="search-box" placeholder="Search Google or type a URL">
        <div class="buttons">
            <button class="btn btn-light">Google Search</button>
            <button class="btn btn-light">I'm Feeling Lucky</button>
        </div>
    </div>
    <div class="footer">
        Google offered in: <a href="#">हिन्दी</a> <a href="#">বাংলা</a> <a href="#">తెలుగు</a> <a href="#">मराठी</a>
    </div>
</body>
</html>
